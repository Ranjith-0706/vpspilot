[package]
name = "vpspilot-desktop"
version = "0.1.0"
description = "VPSPilot - open-source VPS monitoring and management"
authors = ["VPSPilot contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v4"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros", "rt-multi-thread"] }
russh = { version = "0.65.0", default-features = false, features = ["flate2", "ring", "rsa"] }
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
rand = { version = "0.10", features = ["thread_rng"] }
serde_json = "1.0.154"

