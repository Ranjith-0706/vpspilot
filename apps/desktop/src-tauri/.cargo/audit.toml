# Policy for `cargo audit` (run from this directory, and by CI). Anything not listed here fails the
# build, so a NEW advisory is never silently accepted.

[advisories]
ignore = [
  # RUSTSEC-2023-0071 "Marvin Attack" in `rsa` (timing side channel in RSA private-key operations).
  #
  # Why it is accepted for now:
  #   * `rsa` 0.10.0 (the fixed version) exists, but both russh 0.65.0 and 0.65.1 pin
  #     `rsa = "=0.10.0-rc.18"`, so it cannot be upgraded from this repository.
  #   * Removing russh's `rsa` feature would stop every RSA private key (RSA-2048 keys are common
  #     and fit the credential store) and every server that only offers an RSA host key from
  #     working: a certain functional break to mitigate a low practical risk.
  #   * VPSPilot only uses RSA for client-side *signatures* during public-key login, on the
  #     user's own machine, against servers the user chose and whose host key they verified.
  #     The advisory's attack needs an observer able to time private-key operations precisely.
  #     That is a reduced exposure, not zero.
  #
  # Re-check when: russh releases a version that depends on rsa >= 0.10.0 (then remove this
  # entry and update), or if the product decides to drop RSA support (then remove the `rsa`
  # feature in Cargo.toml and this entry).
  "RUSTSEC-2023-0071",
]

# ---------------------------------------------------------------------------------------------
# Warnings that are reported but do NOT fail `cargo audit` (they are unmaintained/unsound notices,
# not vulnerabilities). They are deliberately NOT listed in `ignore` above, so they stay visible
# in every run and a change in their status is noticed. Reviewed 2026-11-19 with
# `cargo tree --target all -e all -i <crate>` and `cargo tree --target x86_64-pc-windows-msvc`.
#
# RUSTSEC-2026-0543  chrono 0.4.45 (unmaintained)
#   Path:   vpspilot-desktop -> russh 0.65.0 -> russh-util 0.52.0 -> chrono
#   Target: russh-util depends on chrono only for `cfg(target_arch = "wasm32")`. It is not in the
#           Windows dependency graph and is not compiled into the Windows release.
#   Decision: track. Nothing to do for the Windows build. Re-check when russh is updated.
#
# RUSTSEC-2024-0370  proc-macro-error 1.0.4 (unmaintained)
#   Path:   vpspilot-desktop -> tauri -> muda -> gtk -> glib -> glib-macros -> proc-macro-error
#   Target: Linux only (the GTK stack that Tauri uses on Linux). Not in the Windows graph and not
#           compiled into the Windows release.
#   Decision: track. Fixed upstream by Tauri/GTK-rs moving off it; no action in this repository.
#
# RUSTSEC-2024-0429  glib 0.18.5 (unsound: VariantStrIter Iterator impls)
#   Path:   vpspilot-desktop -> tauri -> muda -> gtk -> glib (same Linux-only GTK stack)
#   Target: Linux only. Not in the Windows graph and not compiled into the Windows release.
#   Decision: track. VPSPilot ships for Windows only. If a Linux build is ever released, this
#             must be reassessed first (upgrade Tauri/GTK-rs to a glib >= 0.20).
#
# Do not change Cargo dependencies only to silence these warnings.
# ---------------------------------------------------------------------------------------------
