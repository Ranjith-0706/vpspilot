name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory is noticed even when nothing is being merged.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (the comment names the release). To update one, resolve the
# new tag to its commit, review the release notes, and change both the SHA and the comment.
env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Frontend first: the Rust build embeds apps/desktop/dist.
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

      - name: Rust formatting
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - name: Rust tests
        # The test that touches the real Windows Credential Manager stays #[ignore]d.
        run: cargo test
        working-directory: apps/desktop/src-tauri

  e2e:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The real frontend in a browser with Tauri's backend mocked: rendering and page behaviour
      # only. SSH, the credential store and SQLite are covered by the Rust tests.
      - name: UI tests
        run: npm run test:e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Policy and the one accepted advisory (with its reasoning) live in
      # apps/desktop/src-tauri/.cargo/audit.toml. Any other advisory fails this job.
      - name: Rust advisories
        run: cargo audit
        working-directory: apps/desktop/src-tauri

      # Only what ships. Dev-only tooling advisories (the lint toolchain) are tracked in
      # docs/audits and do not reach users.
      - name: npm advisories (production dependencies)
        run: npm audit --omit=dev --audit-level=moderate
        working-directory: apps/desktop
